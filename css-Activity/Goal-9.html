<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: white;
    }

    h1{
        color: Black;
        font-size: 50px;
    }
    .container{
        gap: 10px;
        font-size: 20px;
        color: white;
        display: flex;
    }

    .Red-box{
        display: inline-block;
        width: 300px;
        height: 300px;
        background-color: red;
        vertical-align: top;
    }

    .Green-box{
        width: 300px;
        height: 300px;
        background-color: green;
    }

    .Blue-box{
        width: 300px;
        height: 300px;
        background-color: blue;
    }
    
</style>
<body>

    <h1> CSS Display Property </h1>

        <div class="container">
            <div class="Red-box"> Red Paragraph </div>

            <div class="Green-box"> Green Paragraph </div>

            <div class="Blue-box"> Blue Paragraph </div>
        </div>
    </div>
    
</body>
</html>
