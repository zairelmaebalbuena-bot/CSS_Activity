<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin: 0%;
        background-color: white;
        box-sizing: border-box;
    }
    .box{
        top: 200px;
        left: 200px;
        background: blue;
        width: 500px;
        height: 300px;
        position: absolute;
    }

    .circle{
        width: 200px;
        height: 200px;
        position: absolute;
        background-color: red;
        border-radius: 50%;
        top: 150px;
        left: 250px;
        
       }
</style>
<body>
    <div class="box">
        <div class="circle"></div>
    </div>

</body>
</html>
