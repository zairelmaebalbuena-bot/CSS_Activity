<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        background-color: rgb(99, 150, 232);
    }


    .white-text{
        color: white;
    }

    #main{
        font-size: 40pt;
        font-weight: 300;
    }
    p{
        color: rgb(255, 94, 0);
    }

    h5{
        color: white;
    }

    #weight{
        font-weight: bolder;
        font-size: 20px;
    }

    #family{
        font-family: cursive; 
    }

    #Align{
        text-align: end;
    }

</style>
<body>

    <h1 class="white-text"> Important CSS Properties </h1>
    <p> Color </p>
    <br>

    <h2  class="white-text" id="main"> Font Size </h2>
    <br>

    <h5 id="weight"> Font weight </h5>
    <h5 id="family"> Font family </h5>
    <h5 id="Align"> Text Align </h5>
    
</body>
</html>
