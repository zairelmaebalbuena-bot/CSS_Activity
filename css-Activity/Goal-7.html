<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Combining CSS Selectors</title>
</head>
<style>
  h1{
    color: blueviolet;
    font-size: 50px;
}

h2{
    color: blueviolet;
    font-size: 30px;
}

.box p{
    color: brown;
    font-size: larger;
}

.list{
    color: blue;
}

.done{
    color: green;
}

ul p.done{
    color: black;
    font-size: 0.5rem;
}
</style>

<body>  
  <h1>To Do List</h1>
  <h2>Monday</h2>
  <div class="box">
    <p class="done">Do these things today!</p>
    <ul class="list">
      <li>Wash Clothes</li>
      <li class="done">Read</li>
      <li class="done">Maths Questions</li>
    </ul>
  </div>

  <ul>
    <p class="done">Other items</p>
  </ul>
  <p>The best preparation for tomorrow is doing your best today.</p>

</body>

</html>
