<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color: white;
        box-sizing: border-box;

    }

    .h1{
        font-size: 50px;
    }

    .container{
        color: white;
    }

    .Red-box{
        margin-bottom: 10px;
        padding: 10px;
        width: 200px;
        height: 200px;
        background-color: red;
    }

    .Green-box{
        margin-bottom: 10px;
        padding: 10px;
        width: 200px;
        height: 200px;
        background-color: green;
    }

    .Blue-box{
        width: 200px;
        height: 200px;
        padding: 10px;
        background-color: blue;
    }
</style>
<body>
    
    <h1> CSS Display Property </h1>

    <div class="container">

        <div class="Red-box"> Red Paragraph </div>

        <div class="Green-box"> Green Paragraph </div>

        <div class="Blue-box"> Blue Paragraph </div>
    </div>
</body>
</html>
